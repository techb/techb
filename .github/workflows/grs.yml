name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    # This adds a "Run workflow" button to the GitHub UI
    inputs:
      reason:
        description: 'Reason for manual run'
        required: true
        default: 'Manual trigger'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&include_all_commits=true&show=prs_merged,prs_merged_percentage
          path: profile/stats.svg
          token: ${{ secrets.README_TOKEN_CLASSIC }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push